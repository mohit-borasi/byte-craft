name: work

on: push

jobs:
  userbuild:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./myaap

    steps:
      - name: download
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: myaap/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: run build
        run: npm run build

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: myaap/dist
          retention-days: 7